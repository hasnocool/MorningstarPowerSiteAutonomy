[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morningstar-powersite-autonomy"
version = "0.2.0"
description = "Local-first predictive energy, battery-autonomy, and decision-support engine for Morningstar power sites"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "hasnocool"}]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
powersite-autonomy = "powersite_autonomy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/powersite_autonomy"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
